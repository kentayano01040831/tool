<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACTRESS RANDOM 9</title><style>
:root{--bg:#0e1013;--card:#1d2128;--text:#f4f5f7;--muted:#9da4ae;--line:#2b3038}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",Arial,sans-serif}header{position:sticky;top:0;z-index:10;background:rgba(14,16,19,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.head,main,.add{max-width:1180px;margin:auto;padding:14px 20px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{margin:0;font-size:19px}button{border:1px solid #3a414b;background:#f4f5f7;color:#111318;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}.tools{display:flex;gap:7px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:12px}.photo{width:100%;aspect-ratio:1;display:block;object-fit:cover;background:#252a31}.name{padding:10px 11px 8px;font-weight:700}.actions{display:flex;gap:6px;padding:0 8px 8px}.actions a,.actions button{flex:1;min-width:0;padding:8px 4px;background:#242a32;color:#fff;border:1px solid #3b424c;text-decoration:none;text-align:center;font-size:11px;border-radius:8px}.delete{position:absolute;right:6px;top:6px;z-index:3;width:28px;height:28px;padding:0;border-radius:50%;background:rgba(180,45,75,.94);color:#fff;border:1px solid #fff;font-size:19px;line-height:1}.panel{border:1px solid var(--line);background:#15181d;border-radius:12px;padding:13px;margin:14px 0}.addform{display:flex;gap:8px}input{flex:1;min-width:0;background:#20242b;color:#fff;border:1px solid #3a414b;border-radius:9px;padding:11px}.msg{color:var(--muted);font-size:12px;margin-top:8px}.candidate-grid,.photo-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:10px}.candidate,.option{overflow:hidden;border:1px solid var(--line);border-radius:9px;background:#1c2026}.pic{aspect-ratio:4/5;overflow:hidden;background:#242932}.pic img{width:100%;height:100%;display:block;object-fit:cover}.candidate button,.option button{width:100%;border:0;border-top:1px solid var(--line);border-radius:0;font-size:11px}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:8px}.reroll{background:#252b34;color:#fff;border-color:#697384;font-size:12px}.hidden{display:none!important}.count{color:var(--muted);font-size:12px;margin-bottom:10px}@media(max-width:600px){.head,main,.add{padding-left:10px;padding-right:10px}.grid{gap:8px}.candidate-grid,.photo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.name{font-size:13px;padding:8px}.actions{gap:4px;padding:0 5px 5px}.actions a,.actions button{font-size:9px;padding:7px 2px}.delete{width:25px;height:25px;font-size:17px}}
</style></head><body><header><div class="head"><h1>ACTRESS RANDOM 9</h1><div class="tools"><button id="draw">9名をランダム抽選</button><button id="all">全員表示</button></div></div></header><section class="add panel"><div class="panelhead"><strong>女優を追加</strong><span id="pool" class="count"></span></div><form id="form" class="addform"><input id="name" placeholder="女優名を入力" autocomplete="off" required><button>候補を検索</button></form><div id="msg" class="msg"></div><div id="candidates" class="hidden"></div></section><main><div id="count" class="count"></div><section id="grid" class="grid"></section></main><script>
const DEFAULT_NAMES=["由愛可奈","佐々木夏菜","幸村泉希","百永さりな","小春ももこ","安達夕莉","平野楓","倉本すみれ","桐谷エマ","野宮あん","御園もも","仲村みう","海老咲あお","枢木あおい","渚恋生","白桃はな","七瀬アリス","音無鈴","福田ゆあ","新木希空","森千里","森川玉緒","輝星きら","来栖唯希","七瀬温","秋山美杏","涼乃愛","三浦奈々","星空ねる","さくらまひる","篠崎沙帆","風見渚月","鷹宮かのん","綾瀬まりあ","柊もみじ","中森ななみ","雛形みくる","有村のぞみ","逢沢みゆ","東雲日奈子"];
const K={custom:"actress_custom_v3",deleted:"actress_deleted_v3",photos:"actress_photos_v3",last:"actress_last_draw_v3"};
const $=function(id){return document.getElementById(id)};const grid=$("grid"),msg=$("msg"),cand=$("candidates");
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
let custom=load(K.custom,[]),deleted=load(K.deleted,{}),photos=load(K.photos,{}),last=load(K.last,[]),mode="random";
function norm(s){return s.trim().toLowerCase()}function cleanup(){var now=Date.now();Object.keys(deleted).forEach(function(k){if(now-deleted[k]>86400000)delete deleted[k]});save(K.deleted,deleted)}cleanup();
function thumb(name,r){r=r||0;var qs=[name+" 女優",name+" プロフィール",name+" 写真",name+" actress",name+" 宣材写真",name+" グラビア",name+" portrait",name+" magazine",name+" インタビュー",name+" event",name+" 最新写真",name+" studio"];var q=qs[r%qs.length];return "https://tse"+(r%4+1)+".mm.bing.net/th?q="+encodeURIComponent(q)+"&w=600&h=750&c=7&rs=1&v="+r}
function candidates(name,r){r=r||0;return [0,1,2,3].map(function(i){return thumb(name,r*4+i)})}
function pool(){var m=new Map(custom.map(function(x){return [norm(x.name),x]}));return DEFAULT_NAMES.map(function(name){return m.get(norm(name))||{name:name}}).concat(custom.filter(function(x){return !DEFAULT_NAMES.some(function(n){return norm(n)===norm(x.name)})})).filter(function(x){return !deleted[norm(x.name)]}).map(function(x){var n=x.name;return {name:n,searchUrl:"https://www.google.com/search?q="+encodeURIComponent(n+" えろ"),imageUrl:photos[norm(n)]||x.imageUrl||thumb(n,0)}})}
function shuffled(){var p=pool();if(p.length<=9)return p;var blocked=new Set(last),a=p.filter(function(x){return !blocked.has(norm(x.name))});if(a.length<9)a=p.slice();a.sort(function(){return Math.random()-.5});var out=a.slice(0,9);last=out.map(function(x){return norm(x.name)});save(K.last,last);return out}
function drawNow(){render(mode==="all"?pool():shuffled());$("pool").textContent="登録 "+pool().length+"人"}
function render(list){grid.innerHTML="";$("count").textContent=list.length+" / "+pool().length+" 名";list.forEach(function(p){var c=document.createElement("article");c.className="card";var im=document.createElement("img");im.className="photo";im.src=p.imageUrl;im.alt=p.name;im.onerror=function(){im.onerror=null;im.src=thumb(p.name,1)};var n=document.createElement("div");n.className="name";n.textContent=p.name;var acts=document.createElement("div");acts.className="actions";var a=document.createElement("a");a.href=p.searchUrl;a.target="_blank";a.rel="noopener";a.textContent="Google検索";var b=document.createElement("button");b.textContent="写真を変更";b.onclick=function(){photoPanel(p.name,0)};acts.append(a,b);var d=document.createElement("button");d.className="delete";d.textContent="×";d.title="削除";d.onclick=function(e){e.stopPropagation();remove(p.name)};c.append(im,n,acts,d);grid.append(c)})}
function remove(name){if(!confirm("「"+name+"」を削除しますか？"))return;deleted[norm(name)]=Date.now();custom=custom.filter(function(x){return norm(x.name)!==norm(name)});delete photos[norm(name)];last=last.filter(function(x){return x!==norm(name)});save(K.deleted,deleted);save(K.custom,custom);save(K.photos,photos);save(K.last,last);msg.textContent=name+" を削除しました。";drawNow()}
function photoPanel(name,r){var area=cand;area.classList.remove("hidden");area.innerHTML="<div class=\"panelhead\"><strong>"+name+" の写真候補</strong><button class=\"reroll\">↻ 別の候補</button></div><div class=\"photo-grid\"></div>";area.querySelector(".reroll").onclick=function(){photoPanel(name,r+1)};var g=area.querySelector(".photo-grid");candidates(name,r).forEach(function(url,i){var o=document.createElement("div");o.className="option";var pic=document.createElement("div");pic.className="pic";var im=document.createElement("img");im.src=url;im.alt="候補"+(i+1);pic.append(im);o.append(pic);var b=document.createElement("button");b.textContent="この写真に変更";b.onclick=function(){photos[norm(name)]=url;save(K.photos,photos);area.classList.add("hidden");drawNow()};o.append(b);g.append(o)})}
$("form").onsubmit=function(e){e.preventDefault();var name=$("name").value.trim();if(!name)return;if(pool().some(function(x){return norm(x.name)===norm(name)})){msg.textContent="この名前はすでに登録されています。";return}msg.textContent="写真候補を表示しています…";photoPanel(name,0);var g=cand.querySelector(".photo-grid");candidates(name,0).forEach(function(url,i){var o=document.createElement("div");o.className="candidate";var pic=document.createElement("div");pic.className="pic";var im=document.createElement("img");im.src=url;im.alt="候補"+(i+1);pic.append(im);o.append(pic);var b=document.createElement("button");b.textContent="この写真で追加";b.onclick=function(){custom.push({name:name,imageUrl:url});save(K.custom,custom);delete deleted[norm(name)];save(K.deleted,deleted);$("name").value="";msg.textContent=name+" を追加しました。";cand.classList.add("hidden");drawNow()};o.append(b);g.append(o)})};
$("draw").onclick=function(){mode="random";drawNow()};$("all").onclick=function(){mode="all";drawNow()};drawNow();
</script></body></html>
